<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Pokemon featured tile image">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="#f8fafc"/>
  <g filter="url(#cardShadow)">
    <rect x="300" y="220" width="600" height="760" rx="56" fill="#ffffff" stroke="#dfe6f1" stroke-width="6"/>
    <rect x="340" y="270" width="520" height="160" rx="24" fill="#f6d365"/>
    <text x="600" y="360" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="700" fill="#111827">Pokemon</text>
    <rect x="340" y="460" width="520" height="440" rx="24" fill="#edf2ff"/>
    <text x="600" y="640" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="120" font-weight="800" fill="#1f2937">151</text>
    <rect x="340" y="730" width="520" height="120" rx="22" fill="#ffffff" stroke="#dfe6f1" stroke-width="4"/>
    <text x="600" y="805" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="600" fill="#374151">Collector Box</text>
  </g>
</svg>

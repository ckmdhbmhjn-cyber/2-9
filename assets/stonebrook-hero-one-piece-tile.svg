<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="One Piece featured tile image">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="#f8fafc"/>
  <g filter="url(#cardShadow)">
    <rect x="300" y="220" width="600" height="760" rx="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="6"/>
    <rect x="340" y="270" width="520" height="160" rx="24" fill="#ef5350"/>
    <text x="600" y="360" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">One Piece</text>
    <rect x="340" y="460" width="520" height="440" rx="24" fill="#fff5f5"/>
    <text x="600" y="640" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="96" font-weight="800" fill="#991b1b">OP-03</text>
    <rect x="340" y="730" width="520" height="120" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    <text x="600" y="805" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="600" fill="#374151">Booster Box</text>
  </g>
</svg>
